analyzer:
  kafka:
    events-similarity-consumer:
      properties:
        bootstrap.servers: localhost:9092
        client.id: "stats.analyzer.events-similarity"
        group.id: analyzer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value.deserializer: ru.practicum.analyzer.kafka.serialization.EventSimilarityAvroDeserializer
      topic: stats.events-similarity.v1
    user-actions-consumer:
      properties:
        bootstrap.servers: localhost:9092
        client.id: "stats.analyzer.user-actions"
        group.id: analyzer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value.deserializer: ru.practicum.analyzer.kafka.serialization.UserActionAvroDeserializer
      topic: stats.user-actions.v1

grpc:
  server:
    port: 0

spring:
  application:
    name: analyzer
  dataSource:
    driverClassName: org.postgresql.Driver
    password: 1qaz!QAZ
    url: jdbc:postgresql://localhost:6549/analyzer
    username: dbuser
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true