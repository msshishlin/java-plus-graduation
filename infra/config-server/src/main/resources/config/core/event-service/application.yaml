grpc:
  client:
    analyzer:
      address: 'discovery:///analyzer'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plainText
    collector:
      address: 'discovery:///collector'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plainText

hibernate:
  jdbc:
    time_zone: UTC
  show_sql: true

server:
  port: 0

spring:
  application:
    name: event-service
  dataSource:
    driverClassName: org.postgresql.Driver
    password: 1qaz!QAZ
    url: jdbc:postgresql://localhost:6552/event-service
    username: dbuser
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always